# Build configuration for the automatic recipe upgrades
#
# The auto-upgrade-helper decides what to upgrade from the recipes bitbake
# parses, so this preset must not pin any version: a PREFERRED_VERSION here
# would hide the real state of the tree from the upgrade check. Use it on top
# of conf_v4 and without any of the wpe-*.conf presets:
#
#   source setup-environment auh qemux86-64 poky layers.webkit conf_v4.auh
#
# conf/include/maintainers.inc carries the maintainer of every recipe, which
# AUH requires, and the list of recipes that are not upgraded automatically.

require conf/include/maintainers.inc
